# Conda environment for BRS_analysis (LIGO LIV broadband rotational seismology).
#
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# Activate: conda activate sixdegrees
#
# Jupyter kernel (once per machine):
#   python -m ipykernel install --user --name sixdegrees --display-name "sixdegrees"
#
# If dispersion notebooks fail with "Cannot convert numpy.ndarray to numpy.ndarray":
#   conda install "pandas>=1.5,<2.2" "numpy>=1.24,<2" --force-reinstall
#
# Editable local sixdegrees (developers):
#   pip install -e /path/to/SixDegreesOfFreedom
name: sixdegrees
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10,<3.13
  - obspy>=1.3.0,<2.0.0
  - numpy>=1.24.0,<2.0.0
  - scipy>=1.7.0,<2.0.0
  - matplotlib>=3.4.0,<4.0.0
  - pandas>=1.5.0,<2.2.0
  - pyyaml>=6.0,<7.0
  - scikit-learn>=0.24.0,<2.0.0
  - requests>=2.25.0,<3.0.0
  - tqdm>=4.65.0,<5.0.0
  - cartopy>=0.20.0,<0.21.0
  - setuptools>=65.0.0
  - jupyter>=1.0.0
  - notebook>=6.5.4
  - ipykernel>=6.25.0
  - ipython>=8.11.0
  - ipywidgets>=8.1.0
  - pip>=22.1
  - pip:
      - sixdegrees>=0.1.1
      - acoustics>=0.2.3
      - typing-extensions>=4.5.0,<5.0.0
